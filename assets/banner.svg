<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0" />
      <stop offset="30%" stop-color="#8b5cf6" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
    </pattern>

    <radialGradient id="glowTopLeft" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowBottomRight" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#bg)" />
  <rect width="1200" height="360" rx="20" fill="url(#glowTopLeft)" />
  <rect width="1200" height="360" rx="20" fill="url(#glowBottomRight)" />
  <rect width="1200" height="360" rx="20" fill="url(#grid)" />
  <rect width="1198" height="358" x="1" y="1" rx="19" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Status Pill -->
  <g transform="translate(440, 40)">
    <rect width="320" height="36" rx="18" fill="#1e1b4b" fill-opacity="0.6" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="24" cy="18" r="4.5" fill="#10b981" />
    <text x="40" y="23" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2">OPEN FOR AI &amp; FRONTEND CREATIONS</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">SHUBHAM DUTTA</text>

  <!-- Subtitle -->
  <text x="600" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#94a3b8" letter-spacing="2.8">UI/UX DESIGNER   •   FRONTEND ARCHITECT   •   AI SPECIALIST</text>

  <!-- Badges / Tags Container -->
  <g transform="translate(185, 235)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="190" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="95" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">🎨 Design Systems</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(205, 0)">
      <rect width="200" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="100" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">⚡ Next.js &amp; TypeScript</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(420, 0)">
      <rect width="200" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="100" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">🤖 AI Apps &amp; Chatbots</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(635, 0)">
      <rect width="195" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="97" y="26" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">🚀 Clean Architecture</text>
    </g>
  </g>

  <!-- Glowing Accent Line -->
  <line x1="120" y1="330" x2="1080" y2="330" stroke="url(#lineGrad)" stroke-width="2.5" />
</svg>