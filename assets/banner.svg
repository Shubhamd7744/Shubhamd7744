<svg fill="none" viewBox="0 0 1200 400" width="1200" height="400" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          position: relative;
          width: 100%;
          height: 400px;
          background: #090b14;
          background: radial-gradient(circle at 15% 20%, rgba(124, 58, 237, 0.28) 0%, transparent 45%),
                      radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.22) 0%, transparent 45%),
                      radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.15) 0%, #090b14 100%);
          border-radius: 16px;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          box-sizing: border-box;
          border: 1px solid rgba(255, 255, 255, 0.1);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 30px;
        }

        .grid-bg {
          position: absolute;
          inset: 0;
          background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
          background-size: 32px 32px;
          pointer-events: none;
        }

        .status-pill {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: rgba(124, 58, 237, 0.15);
          border: 1px solid rgba(139, 92, 246, 0.35);
          color: #c4b5fd;
          padding: 6px 18px;
          border-radius: 9999px;
          font-size: 13px;
          font-weight: 600;
          letter-spacing: 1px;
          text-transform: uppercase;
          margin-bottom: 18px;
          backdrop-filter: blur(8px);
        }

        .status-dot {
          width: 8px;
          height: 8px;
          background: #10b981;
          border-radius: 50%;
          box-shadow: 0 0 10px #10b981;
        }

        .title {
          font-size: 50px;
          font-weight: 800;
          letter-spacing: -0.5px;
          margin: 0;
          background: linear-gradient(135deg, #ffffff 30%, #a78bfa 70%, #38bdf8 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          text-align: center;
          line-height: 1.15;
        }

        .subtitle {
          color: #94a3b8;
          font-size: 18px;
          font-weight: 500;
          letter-spacing: 2px;
          text-transform: uppercase;
          margin-top: 12px;
          margin-bottom: 24px;
          text-align: center;
        }

        .highlight {
          color: #38bdf8;
          font-weight: 600;
        }

        .tags-wrapper {
          display: flex;
          gap: 12px;
          flex-wrap: wrap;
          justify-content: center;
        }

        .tag {
          display: flex;
          align-items: center;
          gap: 6px;
          background: rgba(255, 255, 255, 0.05);
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #e2e8f0;
          padding: 7px 16px;
          border-radius: 8px;
          font-size: 13px;
          font-weight: 500;
          backdrop-filter: blur(6px);
        }

        .tag-icon {
          font-size: 14px;
        }

        .glow-line {
          position: absolute;
          bottom: 0;
          left: 10%;
          right: 10%;
          height: 2px;
          background: linear-gradient(90deg, transparent, #8b5cf6, #06b6d4, transparent);
          opacity: 0.8;
        }
      </style>

      <div class="container">
        <div class="grid-bg"></div>
        
        <div class="status-pill">
          <span class="status-dot"></span>
          <span>Open for AI &amp; Frontend Innovations</span>
        </div>

        <h1 class="title">SHUBHAM DUTTA</h1>
        <div class="subtitle">UI/UX Designer <span class="highlight">•</span> Frontend Architect <span class="highlight">•</span> AI Specialist</div>

        <div class="tags-wrapper">
          <div class="tag"><span class="tag-icon">🎨</span> Design Systems &amp; Figma</div>
          <div class="tag"><span class="tag-icon">⚡</span> Next.js &amp; TypeScript</div>
          <div class="tag"><span class="tag-icon">🤖</span> AI Chatbots &amp; GenAI Apps</div>
          <div class="tag"><span class="tag-icon">🚀</span> High-Performance UI</div>
        </div>

        <div class="glow-line"></div>
      </div>
    </div>
  </foreignObject>
</svg>